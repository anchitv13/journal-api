spring:
  datasource:
    url: jdbc:h2:mem:journal_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-bytes-long
    expiration: 3600000
